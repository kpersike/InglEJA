<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InglEJA - Dashboard</title>
    <style>
        /* CSS Rápido para visualização */
        body { font-family: sans-serif; background: #f4f4f9; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .grid-licoes { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .card-licao { background: #fff; padding: 20px; border-radius: 10px; border-left: 5px solid #4CAF50; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        button { background: #4CAF50; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h1>InglEJA</h1>
            <p>Olá, <span id="nome-usuario">Aluno</span>! Pronto para aprender?</p>
        </div>
        <div>
            <strong>Pontos: <span id="pontos-usuario">0</span></strong>
            <button onclick="logout()" style="background: #ff4444; margin-left: 15px;">Sair</button>
        </div>
    </div>

    <div id="container-licoes" class="grid-licoes">
        </div>

    <script>
        // 1. Verificar se está logado
        const dados = localStorage.getItem('usuarioLogado');
        if (!dados) {
            window.location.href = 'index.html'; // Se não houver dados, volta pro login
        }
        const usuario = JSON.parse(dados);
        document.getElementById('nome-usuario').innerText = usuario.nome;
        document.getElementById('pontos-usuario').innerText = usuario.pontos;

        // 2. Buscar lições do servidor
        async function buscarLicoes() {
            try {
                const response = await fetch('/api/licoes');
                const licoes = await response.json();
                
                const container = document.getElementById('container-licoes');
                container.innerHTML = '';

                licoes.forEach(licao => {
                    container.innerHTML += `
                        <div class="card-licao">
                            <h3>${licao.titulo}</h3>
                            <p>Ganhe ${licao.pontos} pontos</p>
                            <button onclick="iniciarLicao(${licao.id})">Começar Lição</button>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Erro ao buscar lições:", err);
            }
        }

        function iniciarLicao(id) {
            localStorage.setItem('licaoAtualId', id);
            window.location.href = 'exercicio.html';
        }

        function logout() {
            localStorage.removeItem('usuarioLogado');
            window.location.href = 'index.html';
        }

        buscarLicoes();
    </script>
</body>
</html>
