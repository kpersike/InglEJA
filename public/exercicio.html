<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InglEJA - Exercício</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container-exercicio { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .btn-audio { background: #1cb0f6; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 1.2rem; cursor: pointer; margin-bottom: 20px; transition: transform 0.2s; }
        .btn-audio:active { transform: scale(0.95); }
        input[type="text"] { width: 100%; padding: 15px; font-size: 1.1rem; border: 2px solid #ddd; border-radius: 10px; margin-bottom: 20px; box-sizing: border-box; }
        .btn-concluir { background: #58cc02; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        #feedback-area { margin-top: 20px; font-weight: bold; min-height: 24px; }
    </style>
</head>
<body>

    <div class="container-exercicio">
        <button onclick="voltarParaDashboard()" style="float: left; background: none; border: none; cursor: pointer;">⬅ Voltar</button>
        <h2 id="titulo-licao">Carregando lição...</h2>
        
        <p id="instrucao">Clique no botão abaixo para ouvir e escreva o que entendeu:</p>
        
        <button class="btn-audio" onclick="tocarAudio()">🔊 Ouvir Pronúncia</button>
        <audio id="player-audio"></audio>

        <p id="pergunta-texto" style="font-style: italic; color: #666;"></p>

        <input type="text" id="resposta-aluno" placeholder="Digite sua resposta aqui...">
        
        <button class="btn-concluir" onclick="finalizarExercicio()">Concluir Exercício</button>

        <div id="feedback-area"></div>
    </div>

    <script src="exercicio.js"></script>
</body>
</html>
